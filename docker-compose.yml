# Full stack: PostgreSQL + FastAPI analyzer + Next.js dashboard.
# Secrets come from ./.env (copy .env.example); nothing secret is written here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipsec_analyzer
      POSTGRES_USER: ipsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsec -d ipsec_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ipsec:${POSTGRES_PASSWORD}@postgres:5432/ipsec_analyzer
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-104857600}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - pcap_storage:/app/storage
      - ./data/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  pcap_storage:
